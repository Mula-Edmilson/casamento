<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Check-in · Amara & Daniel</title><link rel="icon" href="assets/media/lirandzo-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/feather-icons"></script><script src="https://unpkg.com/html5-qrcode"></script><script src="event-data.js"></script><script src="client-config.js"></script><script src="lirandzo-api.js"></script><style>:root{--bg:#1f1714;--card:#2c221e;--line:#493a32;--text:#f8efe8;--muted:#cdbfb3;--accent:#c8a47e;--ok:#55c58b;--danger:#ef6461;--font-h:'Cormorant Garamond',serif;--font-b:'Inter',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(200,164,126,.16),transparent 30%),var(--bg);font-family:var(--font-b);color:var(--text);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 60px}.head{text-align:center;margin:20px 0}.head img{width:62px}.head h1{font-family:var(--font-h);font-size:38px;margin:10px 0 4px}.card{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:20px;box-shadow:0 22px 70px rgba(0,0,0,.28);margin-bottom:16px}.input{width:100%;background:#191210;border:1px solid var(--line);border-radius:999px;color:var(--text);padding:15px 18px;font-size:16px}.btn{border:0;border-radius:999px;background:var(--accent);color:#221814;padding:14px 18px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.secondary{background:#372b26;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.result{display:none}.result.show{display:block}.guest-name{font-family:var(--font-h);font-size:34px;color:#fff;margin:8px 0}.status{padding:12px 14px;border-radius:18px;margin-top:14px}.status.ok{background:rgba(85,197,139,.15);color:var(--ok)}.status.danger{background:rgba(239,100,97,.15);color:var(--danger)}#reader{border-radius:24px;overflow:hidden;background:#111;min-height:260px}.small{color:var(--muted);font-size:14px;line-height:1.5}@media(max-width:520px){.actions .btn{width:100%}.head h1{font-size:31px}}</style></head><body><main class="wrap"><header class="head"><img src="assets/media/lirandzo-logo.svg" alt="Lirandzo"><h1>Check-in do Evento</h1><p class="small">Amara & Daniel · 18 de dezembro de 2026</p></header><section class="card" id="loginCard"><p>Insira a senha da equipa de recepção.</p><input class="input" type="password" id="pass" placeholder="Senha de check-in"><div class="actions"><button class="btn" id="enter"><i data-feather="lock"></i>Entrar</button><a class="btn secondary" href="admin.html">Painel do cliente</a></div><p id="err" style="color:var(--danger)"></p></section><section class="card" id="scannerCard" style="display:none"><h2 style="font-family:var(--font-h);margin:0 0 12px">Scanner QR</h2><div id="reader"></div><div class="actions"><button class="btn secondary" id="startScan"><i data-feather="camera"></i>Iniciar câmara</button><button class="btn secondary" id="stopScan"><i data-feather="camera-off"></i>Parar</button></div><p class="small">Também pode inserir o token manualmente.</p><input class="input" id="manualToken" placeholder="Token do convidado"><div class="actions"><button class="btn" id="manualBtn"><i data-feather="check-circle"></i>Confirmar entrada</button></div></section><section class="card result" id="result"><small class="small" id="guestNumber"></small><div class="guest-name" id="guestName">Convidado</div><p id="guestInfo" class="small"></p><div class="status" id="status"></div></section></main><script>feather.replace();let scanner=null;function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function extractToken(value){let v=String(value||'').trim();try{let u=new URL(v);v=u.searchParams.get('t')||v;}catch(e){}return v;}async function processToken(raw){const token=extractToken(raw); if(!token){showError('Token vazio.');return;} const res=await LirandzoAPI.get('get_guest',{token}); if(!res||res.status!=='success'){showError('Convidado não encontrado.');return;} const g=res.data||res; await LirandzoAPI.post({action:'checkin_guest',token, nome:g.name||g.nome, guests:g.maxGuests||1, mesa:g.mesa||'A definir', operator:'Recepção', timestamp:new Date().toISOString()}); result.classList.add('show'); guestNumber.textContent='#'+(g.number||'')+' · '+(g.category==='Couple'?'Casal':'Individual'); guestName.textContent=g.name||g.nome; guestInfo.textContent='Mesa: '+(g.mesa||'A definir')+' · Pessoas autorizadas: '+(g.maxGuests||1); status.className='status ok'; status.textContent='Entrada confirmada com sucesso.';}function showError(msg){result.classList.add('show');guestNumber.textContent='';guestName.textContent='Atenção';guestInfo.textContent='';status.className='status danger';status.textContent=msg;}enter.onclick=()=>{if(pass.value===(window.LIRANDZO_CHECKIN_PASSWORD||'demo2026')){loginCard.style.display='none';scannerCard.style.display='block';let t=new URLSearchParams(location.search).get('t'); if(t) processToken(t);}else err.textContent='Senha incorrecta.'};manualBtn.onclick=()=>processToken(manualToken.value);startScan.onclick=async()=>{if(!window.Html5Qrcode){showError('Biblioteca de scanner não carregou. Use o token manual.');return;} if(scanner) return; scanner=new Html5Qrcode('reader'); try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>processToken(txt));}catch(e){showError('Não foi possível iniciar a câmara. Autorize o acesso ou use o token manual.');scanner=null;}};stopScan.onclick=async()=>{if(scanner){await scanner.stop();scanner=null;}};pass.addEventListener('keydown',e=>{if(e.key==='Enter') enter.click()});</script></body></html>
