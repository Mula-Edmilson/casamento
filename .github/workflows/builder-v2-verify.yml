name: Builder V2 Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'convite/**'
      - '.github/workflows/builder-v2-verify.yml'
  push:
    branches:
      - 'feature/builder-v2-*'
    paths:
      - 'convite/**'
      - '.github/workflows/builder-v2-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: convite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Builder V2 and regressions
        run: npm run verify
