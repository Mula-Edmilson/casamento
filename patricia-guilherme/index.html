<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Convite de Casamento — Patrícia & Guilherme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon e Open Graph -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/T3tNdXL6/lirandzo.png">
  <meta property="og:title" content="Convite de Casamento — Patrícia & Guilherme">
  <meta property="og:description" content="Junte-se a nós para celebrar o nosso casamento e o início de uma nova etapa das nossas vidas.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://i.postimg.cc/gJCM1hbX/PG_hero.jpg">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #F8F9FC;
      --accent: #9BA3B0;
      --text: #ffffff;
      --text-dark: #2C3E4F;
      --text-light: #333d47;
      --border-color: #D5DCE6;
      --card: #FFFFFF;
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
      --font-script: 'Parisienne', cursive;
      --section-bg: #F0F2F7;
      --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    body.loading {
      opacity: 0;
    }

    body.loaded {
      opacity: 1;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Vídeo de fundo */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
    }

    /* Overlay com gradiente */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.6)
      );
      z-index: -1;
    }

    .content {
      position: relative;
      text-align: center;
      max-width: 600px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .subtitle {
      letter-spacing: 0.25em;
      font-size: 0.8rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Countdown */
    .countdown-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin: 1rem 0;
    }

    .days-label {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .days-number {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 10vw, 5.5rem);
      font-weight: 700;
      line-height: 1;
      color: white;
    }

    .days-text {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-align: left;
      line-height: 1.2;
    }

    .quotation {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: rgba(255, 255, 255, 0.7);
      margin: 0.7rem auto 0.4rem;
    }

    .time-row {
      display: flex;
      gap: 1.4rem;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.9;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }

    .time-value {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .time-label {
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .names {
      font-family: var(--font-script);
      font-size: 5rem;
      color: white;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      margin: 1rem 0 0.5rem;
    }

    .date-text {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Botão Abrir convite */
    .btn-open {
      padding: 0.85rem 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      margin-top: 2rem;
    }

    .btn-open:hover {
      background: #8A939F;
      border-color: #8A939F;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }

    /* Overlay de Login (popup) */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .login-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 48px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .login-overlay.visible .login-container {
      transform: scale(1);
    }

    .login-container .names {
      font-size: 3.5rem;
      color: var(--accent);
      text-shadow: none;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      margin: 8px 0 24px 0;
      font-size: 1rem;
      color: var(--text-light);
    }

    #loginForm .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    #loginForm label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    #loginForm input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      font-family: var(--font-body);
    }

    .btn {
      display: inline-block;
      font-family: var(--font-body);
      padding: 12px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.9rem;
      transition: var(--transition-smooth);
      text-align: center;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #8A939F;
      border-color: #8A939F;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(155, 163, 176, 0.2);
    }

    .btn-close {
      background-color: transparent;
      color: var(--text-light);
      border-color: var(--border-color);
      margin-top: 8px;
    }

    .btn-close:hover:not(:disabled) {
      background-color: var(--section-bg);
    }

    .login-error-message {
      font-size: 0.9rem;
      color: #D93025;
      margin-top: 16px;
      min-height: 1.2em;
    }

    @media (max-width: 768px) {
      .names {
        font-size: 3.5rem;
      }
      .login-container {
        padding: 32px 24px;
      }
      .login-container .names {
        font-size: 3rem;
      }
      .time-row {
        gap: 1rem;
      }
    }
       .bg-image{
       position: fixed;
       top:0;
     left:0;
     width:100vw;
     height:100vh;
    object-fit: cover;
    z-index:-1;
  }
  </style>
</head>
<body class="loading">

  <div class="page">
    <!-- Imagem de fundo -->
    <img 
      class="bg-image"
      src="https://i.postimg.cc/wvCWnNYh/PG_capa1.jpg"
      alt="background"
    >

    <div class="overlay"></div>

    <div class="content">
      <div class="subtitle">CONTAGEM DECRESCENTE PARA O NOSSO DIA</div>

      <div class="countdown-main">
        <div class="days-label">
          <span id="days" class="days-number">0</span>
          <div class="days-text">
            <div>DIAS</div>
            <div>ATÉ</div>
          </div>
        </div>

        <div class="quotation">"SIM, ACEITO!"</div>
        <div class="divider"></div>

        <div class="time-row" id="timeRow">
          <div class="time-box">
            <span id="hours" class="time-value">00</span>
            <span class="time-label">HORAS</span>
          </div>
          <div class="time-box">
            <span id="minutes" class="time-value">00</span>
            <span class="time-label">MINUTOS</span>
          </div>
          <div class="time-box">
            <span id="seconds" class="time-value">00</span>
            <span class="time-label">SEGUNDOS</span>
          </div>
        </div>
      </div>

      <h1 class="names">Patrícia & Guilherme</h1>
      <div class="date-text">10 DE JANEIRO 2026</div>
      
      <!-- Botão que abre o popup de login -->
      <button class="btn-open" id="openLoginBtn">
        ABRIR CONVITE
      </button>
    </div>
  </div>

  <!-- Overlay de Login (popup) -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-container">
      <h2 class="names">Patrícia & Guilherme</h2>
      <p class="login-subtitle">Por favor, identifique-se para ver o convite</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="name">Somente o primeiro nome</label>
          <input type="text" id="name" placeholder="(Primeiro Nome)" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Entrar</button>
        <button type="button" class="btn btn-close" id="closeLoginBtn">Cancelar</button>
        <p id="loginError" class="login-error-message"></p>
      </form>
    </div>
  </div>

  <script>
    // URL do servidor
    const API_ENDPOINT = "https://api-casamento-mj.onrender.com/api";

    // Data do casamento
    const weddingDate = new Date("2026-05-02T10:00:00");

    // Elementos do countdown
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function updateCountdown() {
      const now = new Date();
      const diff = weddingDate.getTime() - now.getTime();

      if (diff <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }

      let totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / (3600 * 24));
      totalSeconds -= days * 3600 * 24;
      const hours = Math.floor(totalSeconds / 3600);
      totalSeconds -= hours * 3600;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds - minutes * 60;

      daysEl.textContent = days;
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    // Função para criar/obter o token do dispositivo
    function getOrCreateLoginToken() {
      let token = localStorage.getItem('loginToken');
      if (!token) {
        token = Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('loginToken', token);
      }
      return token;
    }

    // Elementos do login
    const openLoginBtn = document.getElementById('openLoginBtn');
    const closeLoginBtn = document.getElementById('closeLoginBtn');
    const loginOverlay = document.getElementById('loginOverlay');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    // Abrir popup
    openLoginBtn.addEventListener('click', () => {
      loginOverlay.classList.add('visible');
      document.getElementById('name').focus();
    });

    // Fechar popup
    closeLoginBtn.addEventListener('click', () => {
      loginOverlay.classList.remove('visible');
      loginError.textContent = '';
      document.getElementById('name').value = '';
    });

    // Fechar ao clicar fora do container
    loginOverlay.addEventListener('click', (e) => {
      if (e.target === loginOverlay) {
        loginOverlay.classList.remove('visible');
        loginError.textContent = '';
        document.getElementById('name').value = '';
      }
    });

    window.onload = () => {
      document.body.classList.remove('loading');
      setTimeout(() => document.body.classList.add('loaded'), 100);
      
      localStorage.removeItem('guestName');
      localStorage.removeItem('guestStatus');
      localStorage.removeItem('guestMesa');
      
      // Iniciar countdown
      updateCountdown();
      setInterval(updateCountdown, 1000);
    };

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginError.textContent = '';
      
      const name = document.getElementById('name').value;
      const loginToken = getOrCreateLoginToken();
      
      submitBtn.disabled = true;
      submitBtn.textContent = "A verificar...";

      fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: "login",
          name: name,
          loginToken: loginToken
        })
      })
      .then(res => {
        if (res.status === 403) {
          window.location.href = 'ja-aberto.html'; 
          return Promise.reject(new Error("Convite já aberto"));
        }
        if (res.status === 401) {
          return res.json().then(data => Promise.reject(data));
        }
        if (!res.ok) {
          return res.json().then(data => Promise.reject(data));
        }
        return res.json();
      })
      .then(data => {
        if (data.status === "success") {
          localStorage.setItem('guestName', data.guestName);
          localStorage.setItem('guestStatus', data.guestStatus);
          localStorage.setItem('guestMesa', data.Mesa);
          
          window.location.href = 'convite.html';
        } else {
          loginError.textContent = data.message || "Ocorreu um erro.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar";
        }
      })
      .catch(err => {
        if (err.message === "Convite já aberto") {
          return; 
        }
        loginError.textContent = err.message || "Erro de ligação. Tente novamente.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      });
    });
  </script>
</body>
</html>
