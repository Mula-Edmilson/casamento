<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepção · QR Check-in — Osvaldo & Gilberta</title>
<script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script><style>body{margin:0;background:#171512;color:#eee;font-family:Inter,Arial,sans-serif;padding:22px}main{max-width:760px;margin:auto}h1{font-family:Georgia,serif;font-weight:500}.card{background:#211e19;border:1px solid #544933;padding:22px;margin:18px 0}#qr-reader{background:#fff}.row{display:flex;gap:10px}input,button{padding:13px;font:inherit}input{flex:1;background:#171512;color:#fff;border:1px solid #6c5d40}button{border:0;background:#b58b3e;color:#fff;font-weight:700;cursor:pointer}.ok{color:#78d29b}.err{color:#ff8b8b}@media(max-width:600px){.row{flex-direction:column}}</style></head><body><main><h1>Recepção · Check-in</h1><p>Osvaldo & Gilberta</p><section class="card"><div id="qr-reader"></div></section><section class="card"><div class="row"><input id="manual" placeholder="Token ou URL do QR"><button id="validate">Validar</button></div><div id="result" style="margin-top:18px"></div></section></main>
<script src="client-config.js"></script><script src="event-data.js"></script><script src="lirandzo-api.js"></script><script>
let currentToken='',currentGuest=null;const result=document.getElementById('result');function tokenFrom(v){try{const u=new URL(v,location.href);return u.searchParams.get('t')||u.searchParams.get('token')||v}catch{return v}}async function validate(v){const t=tokenFrom(String(v||'').trim());if(!t)return;currentToken=t;result.textContent='A validar...';try{const r=await LirandzoAPI.get('get_guest',{token:t});currentGuest=r.data||r;const n=currentGuest.name||currentGuest.nome||'Convidado',m=currentGuest.mesa||currentGuest.table||'A definir';result.innerHTML='<strong>'+n+'</strong><br>Mesa: '+m+'<br><button id="doCheck" style="margin-top:14px">Confirmar check-in</button>';document.getElementById('doCheck').onclick=checkin;}catch(e){result.textContent=e.message||'Convidado não encontrado.';result.className='err';}}async function checkin(){try{await LirandzoAPI.post({action:'checkin_guest',token:currentToken,nome:currentGuest?.name||currentGuest?.nome||''});result.innerHTML='<span class="ok">Check-in confirmado com sucesso.</span>';}catch(e){result.textContent=e.message||'Erro no check-in.';result.className='err';}}document.getElementById('validate').onclick=()=>validate(document.getElementById('manual').value);document.getElementById('manual').addEventListener('keydown',e=>{if(e.key==='Enter')validate(e.target.value)});if(window.Html5Qrcode){const qr=new Html5Qrcode('qr-reader');qr.start({facingMode:'environment'},{fps:10,qrbox:250},txt=>{qr.stop().catch(()=>{});validate(txt);}).catch(()=>{document.getElementById('qr-reader').innerHTML='<p style="color:#222;padding:20px">Câmara indisponível. Use o campo manual.</p>';});}</script></body></html>
