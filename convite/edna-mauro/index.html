<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Convite de Casamento — Edna &amp; Mauro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />

  <link rel="icon" type="image/png" href="assets/media/lirandzo-logo.svg">
  <meta property="og:title" content="Convite de Casamento — Edna & Mauro">
  <meta property="og:description" content="Junte-se a nós para celebrar o nosso casamento e o início de uma nova etapa das nossas vidas.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/media/edna-mauro-casal.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --accent: #8A5A44;
      --accent-dark: #5F3E32;
      --text: #ffffff;
      --text-dark: #1F1F1F;
      --text-light: #4A4A4A;
      --text-muted: #6A6256;
      --border-color: rgba(138,90,68,0.32);
      --card: #ffffff;
      --card-soft: rgba(255, 255, 255, 0.92);
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
      --font-script: 'Parisienne', cursive;
      --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      --danger: #b44747;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.5s ease;
      background-color: var(--bg);
    }

    body.loading { opacity: 0; }
    body.loaded { opacity: 1; }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .bg-image {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center 28%;
      z-index: -2;
      transform: scale(1.02);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.02) 0%,
          rgba(255,255,255,0.08) 38%,
          rgba(244, 232, 220, 0.38) 56%,
          rgba(247,239,230,0.82) 76%,
          rgba(251,246,239,0.98) 100%
        ),
        linear-gradient(90deg, rgba(138,90,68,0.05), rgba(138,90,68,0.02));
      z-index: -1;
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20220%20220%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%238A5A44%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20opacity%3D%22.45%22%3E%3Cpath%20d%3D%22M186%2018c-5%2019-12%2035-24%2048-13%2014-28%2024-52%2032%22/%3E%3Cpath%20d%3D%22M147%2031c13%206%2024%2017%2030%2031%22/%3E%3Cpath%20d%3D%22M124%2041c6%209%2010%2020%2010%2031%22/%3E%3Cpath%20d%3D%22M92%2098c-10-10-22-16-38-18%22/%3E%3Cpath%20d%3D%22M55%2080c6%208%2010%2018%2011%2029%22/%3E%3Cpath%20d%3D%22M102%20107c-10%2011-17%2023-22%2037%22/%3E%3Cpath%20d%3D%22M80%20144c10%200%2018%203%2025%208%22/%3E%3Ccircle%20cx%3D%22148%22%20cy%3D%2231%22%20r%3D%228%22/%3E%3Ccircle%20cx%3D%22124%22%20cy%3D%2241%22%20r%3D%2210%22/%3E%3Ccircle%20cx%3D%2255%22%20cy%3D%2280%22%20r%3D%229%22/%3E%3Ccircle%20cx%3D%2280%22%20cy%3D%22144%22%20r%3D%2211%22/%3E%3C/g%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-size: contain;
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .page::before { top: -70px; left: -70px; transform: rotate(-8deg); }
    .page::after { right: -85px; bottom: -85px; transform: rotate(180deg); }

    .content {
      position: relative;
      text-align: center;
      max-width: 720px;
      width: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .subtitle {
      letter-spacing: 0.28em;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-dark);
      opacity: 0.88;
    }

    .countdown-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      margin: 0.4rem 0 0.5rem;
    }

    .days-label {
      display: flex;
      align-items: flex-end;
      gap: 0.7rem;
    }

    .days-number {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 10vw, 5.8rem);
      font-weight: 700;
      line-height: 1;
      color: var(--text-dark);
    }

    .days-text {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-align: left;
      line-height: 1.3;
      color: var(--text-light);
    }

    .quotation {
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .divider {
      width: 120px;
      height: 1px;
      background: rgba(138,90,68, 0.50);
      margin: 0.6rem auto 0.3rem;
    }

    .time-row {
      display: flex;
      gap: 1.2rem;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-light);
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.16rem;
      min-width: 70px;
    }

    .time-value {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text-dark);
    }

    .time-label {
      font-size: 0.68rem;
      opacity: 0.8;
    }

    .names {
      font-family: var(--font-script);
      font-size: 5rem;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 10px 22px rgba(255,255,255,0.28);
      margin: 0.7rem 0 0.2rem;
    }

    .date-text {
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dark);
      opacity: 0.86;
    }

    .btn-open {
      padding: 0.95rem 2.5rem;
      border-radius: 999px;
      border: 1px solid rgba(138,90,68,0.42);
      background: rgba(251,246,239,0.72);
      color: var(--accent);
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 12px 30px rgba(74,56,42,0.1);
      margin-top: 1.3rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-weight: 600;
    }

    .btn-open:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(74,56,42,0.16);
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(44, 34, 27, 0.58);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .login-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .login-container {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.42)),
        repeating-linear-gradient(90deg, rgba(138,90,68,0.018) 0, rgba(138,90,68,0.018) 1px, transparent 1px, transparent 8px),
        var(--card);
      border: 1px solid rgba(138,90,68,0.26);
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 26px 80px rgba(0,0,0,0.22);
      max-width: 560px;
      width: 100%;
      transform: scale(0.95) translateY(10px);
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      overflow: hidden;
      position: relative;
    }

    .login-overlay.visible .login-container {
      transform: scale(1) translateY(0);
    }

    .login-hero {
      position: relative;
      min-height: 180px;
      background-image: url('assets/media/edna-mauro-casal.jpg');
      background-size: cover;
      background-position: center 30%;
      overflow: hidden;
    }

    .login-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      background-size: cover;
      background-position: center 30%;
      transform: scale(1.05);
    }

    .login-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(30,21,17,0.78) 0%,
        rgba(63,49,39,0.38) 24%,
        rgba(251,246,239,0.18) 58%,
        rgba(251,246,239,0.96) 100%);
    }

    .login-badge {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.48);
      color: white;
      z-index: 2;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
    }

    .login-badge svg { width: 28px; height: 28px; }

    .login-body {
      padding: 0 34px 34px;
      position: relative;
    }

    .login-container .names {
      font-size: 3.5rem;
      color: var(--accent);
      text-shadow: none;
      margin-bottom: 0.3rem;
    }

    .login-subtitle {
      margin: 6px 0 26px 0;
      font-size: 0.98rem;
      color: var(--text-light);
    }

    .login-kicker {
      display: inline-block;
      margin-top: -8px;
      margin-bottom: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    #loginForm {
      text-align: left;
    }

    #loginForm .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    #loginForm label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(138,90,68,0.24);
      border-radius: 14px;
      padding: 0 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .input-shell svg {
      width: 18px;
      height: 18px;
      color: var(--accent);
      opacity: 0.85;
      flex-shrink: 0;
    }

    #loginForm input {
      width: 100%;
      padding: 14px 12px;
      border-radius: 14px;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text-dark);
      font-family: var(--font-body);
      transition: all 0.3s ease;
    }

    #loginForm input::placeholder { color: #8A8A8A; }

    #loginForm input:focus {
      outline: none;
    }

    .input-shell:focus-within {
      border-color: rgba(138,90,68,0.62);
      box-shadow: 0 0 0 4px rgba(138,90,68,0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      padding: 13px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.88rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: var(--transition-smooth);
      text-align: center;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(138,90,68,0.14);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(138,90,68,0.24);
    }

    .btn-close {
      background-color: rgba(255,255,255,0.52);
      color: var(--text-light);
      border-color: rgba(138,90,68,0.28);
      margin-top: 10px;
    }

    .btn-close:hover:not(:disabled) {
      background-color: rgba(138,90,68,0.10);
      color: var(--accent-dark);
    }

    .login-error-message {
      font-size: 0.9rem;
      color: var(--danger);
      margin-top: 16px;
      min-height: 1.2em;
      text-align: center;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .info-text {
      margin-top: 22px;
      font-size: 0.83rem;
      color: var(--text-muted);
      padding-top: 18px;
      border-top: 1px solid rgba(138,90,68,0.14);
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .info-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-line svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .names { font-size: 3.9rem; }
      .content { padding: 1rem 0.5rem; }
      .time-row { gap: 0.75rem; }
      .time-box { min-width: 62px; }
      .page::before,
      .page::after { width: 180px; height: 180px; }
      .login-body { padding: 0 22px 24px; }
      .login-container .names { font-size: 2.9rem; }
      .login-hero { min-height: 156px; }
    }
  

    /* Ajuste final — capa rustic chic */
    body {
      background-color: #ffffff;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(216, 189, 128, 0.18), transparent 44%),
        linear-gradient(180deg, #ffffff 0%, #ffffff 100%);
    }

    .overlay {
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.10) 38%,
          rgba(255,248,232,0.42) 56%,
          rgba(255,250,240,0.84) 76%,
          rgba(255,255,255,1) 100%
        ),
        linear-gradient(90deg, rgba(138,90,68,0.08), rgba(255,255,255,0.02));
    }

    .btn-open {
      border-color: rgba(138,90,68,0.48);
      background: rgba(255,255,255,0.76);
      color: var(--accent-dark);
      box-shadow: 0 12px 30px rgba(138,90,68,0.12);
    }

    .btn-open:hover,
    .btn-primary {
      background: linear-gradient(135deg, #A9795E, #8A5A44);
      border-color: rgba(138,90,68, 0.92);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #8A5A44, #5F3E32);
      border-color: #5F3E32;
    }

    .login-overlay {
      background-color: rgba(15, 15, 15, 0.46);
    }

    .login-container {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,250,240,0.82)),
        repeating-linear-gradient(90deg, rgba(138,90,68,0.022) 0, rgba(138,90,68,0.022) 1px, transparent 1px, transparent 8px),
        #ffffff;
      border-color: rgba(138,90,68,0.32);
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.22);
    }

    .login-hero-overlay {
      background: linear-gradient(to bottom,
        rgba(18, 18, 18, 0.56) 0%,
        rgba(138,90,68, 0.28) 28%,
        rgba(255,250,240,0.24) 58%,
        rgba(255,255,255,0.98) 100%);
    }

    .login-badge {
      background: rgba(255,255,255,0.24);
      border-color: rgba(255,255,255,0.58);
      color: #ffffff;
    }

    .divider {
      background: rgba(138,90,68, 0.46);
    }

    .input-shell {
      background: rgba(255,255,255,0.84);
      border-color: rgba(138,90,68,0.26);
    }

    .input-shell:focus-within {
      border-color: rgba(138,90,68,0.58);
      box-shadow: 0 0 0 4px rgba(138,90,68,0.12);
    }

    .btn-close {
      background-color: rgba(255,255,255,0.64);
      color: var(--text-light);
      border-color: rgba(138,90,68,0.28);
    }

    .btn-close:hover:not(:disabled) {
      background-color: rgba(138,90,68,0.10);
      color: var(--accent-dark);
    }


    /* CORRECÇÃO DEFINITIVA — capa rustic chic real */
    body {
      background-color: #ffffff !important;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(138,90,68, 0.14), transparent 42%),
        linear-gradient(180deg, #ffffff 0%, #ffffff 100%) !important;
    }

    .overlay {
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.08) 38%,
          rgba(255,255,255,0.54) 60%,
          rgba(255,255,255,0.90) 82%,
          rgba(255,255,255,1) 100%
        ),
        linear-gradient(90deg, rgba(138,90,68,0.10), rgba(255,255,255,0.02)) !important;
    }

    .btn-open {
      border-color: rgba(138,90,68,0.54) !important;
      background: rgba(255,255,255,0.82) !important;
      color: var(--accent-dark) !important;
      box-shadow: 0 12px 30px rgba(138,90,68,0.14) !important;
    }

    .btn-open:hover,
    .btn-primary {

      border-color: #8A5A44 !important;
      color: #ffffff !important;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #8A5A44, #5F3E32) !important;
      border-color: #5F3E32 !important;
    }

    .login-overlay {
      background-color: rgba(15, 15, 15, 0.42) !important;
    }

    .login-container {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94)),
        repeating-linear-gradient(90deg, rgba(138,90,68,0.024) 0, rgba(138,90,68,0.024) 1px, transparent 1px, transparent 8px),
        #ffffff !important;
      border-color: rgba(138,90,68,0.38) !important;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.16) !important;
    }

    .login-hero-overlay {
      background: linear-gradient(to bottom,
        rgba(18, 18, 18, 0.48) 0%,
        rgba(138,90,68, 0.24) 34%,
        rgba(255,255,255,0.28) 62%,
        rgba(255,255,255,0.98) 100%) !important;
    }

    .divider {
      background: rgba(138,90,68, 0.56) !important;
    }

    .input-shell {
      background: rgba(255,255,255,0.96) !important;
      border-color: rgba(138,90,68,0.34) !important;
    }

    .input-shell:focus-within {
      border-color: rgba(138,90,68,0.70) !important;
      box-shadow: 0 0 0 4px rgba(138,90,68,0.14) !important;
    }

    .script-text,
    .date-line,
    .login-kicker,
    #loginForm label,
    .info-line svg {
      color: var(--accent) !important;
    }

    .names,
    .login-container .names,
    .info-line strong,
    #loginForm input {
      color: var(--text-dark) !important;
    }

    .subtitle,
    .venue,
    .login-subtitle,
    .info-line,
    .login-footer,
    .login-hint {
      color: var(--text-light) !important;
    }


    /* REFINO FINAL — capa rustic chic real, sem castanho residual */
    body {
      background: #ffffff !important;
      color: var(--text-light) !important;
    }

    .overlay {
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.08) 38%,
          rgba(255,255,255,0.54) 60%,
          rgba(255,255,255,0.90) 82%,
          rgba(255,255,255,1) 100%),
        linear-gradient(90deg, rgba(138,90,68,0.08), rgba(255,255,255,0.02)) !important;
    }

    .login-container,
    .input-shell,
    .info-line {
      background-color: rgba(255,255,255,0.96) !important;

  <!-- PÁGINA PRINCIPAL -->
  <div class="page">
    <img class="bg-image" src="assets/media/edna-mauro-casal.jpg" alt="Edna e Mauro — Save the Date">
    <div class="overlay"></div>

    <div class="content">
      <div class="subtitle">CONTAGEM DECRESCENTE PARA O NOSSO DIA</div>

      <div class="countdown-main">
        <div class="days-label">
          <span id="days" class="days-number">0</span>
          <div class="days-text">
            <div>DIAS</div>
            <div>ATÉ</div>
          </div>
        </div>

        <div class="quotation">"SIM, ACEITO!"</div>
        <div class="divider"></div>

        <div class="time-row" id="timeRow">
          <div class="time-box">
            <span id="hours" class="time-value">00</span>
            <span class="time-label">HORAS</span>
          </div>
          <div class="time-box">
            <span id="minutes" class="time-value">00</span>
            <span class="time-label">MINUTOS</span>
          </div>
          <div class="time-box">
            <span id="seconds" class="time-value">00</span>
            <span class="time-label">SEGUNDOS</span>
          </div>
        </div>
      </div>

      <h1 class="names">Edna & Mauro</h1>
      <div class="date-text">7 DE NOVEMBRO 2026</div>
      
      <button class="btn-open" id="openLoginBtn">
        ABRIR CONVITE
      </button>
    </div>
  </div>


  <script>
    const WEDDING_DATE = new Date("2026-11-07T13:00:00+02:00");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const openInviteBtn = document.getElementById('openLoginBtn');

    function updateCountdown() {
      const diff = WEDDING_DATE.getTime() - Date.now();
      if (diff <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }
      let totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      totalSeconds -= days * 86400;
      const hours = Math.floor(totalSeconds / 3600);
      totalSeconds -= hours * 3600;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds - minutes * 60;
      daysEl.textContent = days;
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('loading');
      setTimeout(() => document.body.classList.add('loaded'), 100);
      updateCountdown();
      setInterval(updateCountdown, 1000);
    });

    openInviteBtn?.addEventListener('click', () => {
      sessionStorage.setItem('lirandzoPlayMusic', '1');
      window.location.href = 'convite.html';
    });
  </script>
