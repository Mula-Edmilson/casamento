<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Convite de Casamento — Juliana & Baptista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#E6EFE5">

  <link rel="icon" type="image/png" href="assets/media/lirandzo-logo.svg">
  <meta property="og:title" content="Convite de Casamento — Juliana & Baptista">
  <meta property="og:description" content="Junte-se a nós para celebrar o nosso casamento e o início de uma nova etapa das nossas vidas.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/media/capa-casal.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET E VARIÁVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #F2F7F1;
      --accent: #5F7D68;
      --text: #ffffff;
      --text-dark: #294438;
      --text-light: #40594D;
      --text-muted: #6D8174;
      --border-color: #C2D2C3;
      --card: #FFFFFF;
      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
      --font-script: 'Parisienne', cursive;
      --section-bg: #E6EFE5;
      --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    body.loading {
      opacity: 0;
    }

    body.loaded {
      opacity: 1;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.6)
      );
      z-index: -1;
    }

    .content {
      position: relative;
      text-align: center;
      max-width: 600px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .subtitle {
      letter-spacing: 0.25em;
      font-size: 0.8rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .countdown-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      margin: 1rem 0;
    }

    .days-label {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .days-number {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 10vw, 5.5rem);
      font-weight: 700;
      line-height: 1;
      color: white;
    }

    .days-text {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-align: left;
      line-height: 1.2;
    }

    .quotation {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: rgba(255, 255, 255, 0.7);
      margin: 0.7rem auto 0.4rem;
    }

    .time-row {
      display: flex;
      gap: 1.4rem;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.9;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }

    .time-value {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .time-label {
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .names {
      font-family: var(--font-script);
      font-size: 5rem;
      color: white;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      margin: 1rem 0 0.5rem;
    }

    .date-text {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .btn-open {
      display: inline-block;
      text-decoration: none;
      padding: 0.85rem 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      margin-top: 2rem;
    }

    .btn-open:hover {
      background: #486354;
      border-color: #486354;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }


    @media (max-width: 768px) {
      .names {
        font-size: 3.5rem;
      }
      .time-row {
        gap: 1rem;
      }
    }
  </style>
</head>
<body class="loading">

  <!-- PÁGINA PRINCIPAL -->
  <div class="page">
    <img class="bg-image" src="assets/media/capa-casal.jpg" alt="background">
    <div class="overlay"></div>

    <div class="content">
      <div class="subtitle">CONTAGEM DECRESCENTE PARA O NOSSO DIA</div>

      <div class="countdown-main">
        <div class="days-label">
          <span id="days" class="days-number">0</span>
          <div class="days-text">
            <div>DIAS</div>
            <div>ATÉ</div>
          </div>
        </div>

        <div class="quotation">"SIM, ACEITO!"</div>
        <div class="divider"></div>

        <div class="time-row" id="timeRow">
          <div class="time-box">
            <span id="hours" class="time-value">00</span>
            <span class="time-label">HORAS</span>
          </div>
          <div class="time-box">
            <span id="minutes" class="time-value">00</span>
            <span class="time-label">MINUTOS</span>
          </div>
          <div class="time-box">
            <span id="seconds" class="time-value">00</span>
            <span class="time-label">SEGUNDOS</span>
          </div>
        </div>
      </div>

      <h1 class="names">Juliana & Baptista</h1>
      <div class="date-text">19 DE SETEMBRO 2026</div>
      
      <a class="btn-open" id="openInviteBtn" href="convite.html">
        ABRIR CONVITE
      </a>
    </div>
  </div>



  <script>
    const WEDDING_DATE = new Date("2026-09-19T10:00:00+02:00");

    function updateCountdown() {
      const diff = WEDDING_DATE.getTime() - Date.now();
      const daysEl = document.getElementById("days");
      const hoursEl = document.getElementById("hours");
      const minutesEl = document.getElementById("minutes");
      const secondsEl = document.getElementById("seconds");
      if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

      if (diff <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        return;
      }

      let totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      totalSeconds -= days * 86400;
      const hours = Math.floor(totalSeconds / 3600);
      totalSeconds -= hours * 3600;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds - minutes * 60;

      daysEl.textContent = String(days);
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('loading');
      requestAnimationFrame(() => document.body.classList.add('loaded'));
      updateCountdown();
      setInterval(updateCountdown, 1000);
    });
  </script>
</body>
</html>
