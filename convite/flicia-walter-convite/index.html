  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getTimeLeft(targetDate) {
    const target = new Date(targetDate).getTime();
    const diff = Math.max(target - Date.now(), 0);
    return {
      days: Math.floor(diff / 86400000),
      hours: Math.floor((diff / 3600000) % 24),
      minutes: Math.floor((diff / 60000) % 60),
      seconds: Math.floor((diff / 1000) % 60),
    };
  }

  function twoDigits(value) {
    return String(value).padStart(2, "0");
  }

  async function apiFetch(endpoint, options = {}) {
    if (!API_BASE) throw new Error("API Render não configurada.");
    const response = await fetch(`${API_BASE}/api${endpoint}`, {
      headers: { "Content-Type": "application/json", "X-Invite-Slug": INVITE_SLUG, ...(options.headers || {}) },
      ...options,
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.status === "error") throw new Error(data.message || data.error || `Erro ${response.status}`);
    return data.data || data;
  }

  async function isBackendAvailable() {
    if (window.LirandzoAPI && typeof window.LirandzoAPI.isConfigured === "function" && window.LirandzoAPI.isConfigured()) return true;
    if (!API_BASE) return false;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      const response = await fetch(`${API_BASE}/health`, { signal: controller.signal, headers: { "X-Invite-Slug": INVITE_SLUG } });
      clearTimeout(timer);
      if (!response.ok) return false;
      const data = await response.json().catch(() => ({}));
      return data.mongo ? data.mongo === "connected" : true;
    } catch {
      return false;
    }
  }

  async function getMode() {
    return (await isBackendAvailable()) ? "live" : "demo";
  }

  async function findGuestByName(name) {
    const cleanName = name.trim();
    if (window.LirandzoAPI && typeof window.LirandzoAPI.get === "function") {
      try {
        const result = await window.LirandzoAPI.get("find_guest", { name: cleanName });
        return result.data || result;
      } catch (err) {
        const localGuest = demoGuests.find((guest) => guest.name.toLowerCase() === cleanName.toLowerCase());
        if (localGuest) return localGuest;
        throw err;
      }
    }

    const live = await isBackendAvailable();
    if (live) {
      return apiFetch("", {
        method: "POST",
        body: JSON.stringify({ action: "login", name: cleanName, slug: INVITE_SLUG }),
      });
    }

    const lowerName = cleanName.toLowerCase();
    return demoGuests.find((guest) => guest.name.toLowerCase() === lowerName) || null;
  }

  async function submitRSVP(guestId, status, guests) {
    const payload = {
      action: status === "confirmed" ? "rsvp" : "rsvp_choice",
      choice: status === "confirmed" ? "confirmed" : "declined",
      nome: state.authGuest?.name || state.authGuest?.nome || "Convidado",
      token: guestToken(),
      guests,
      slug: INVITE_SLUG,
    };

    try {
      if (window.LirandzoAPI && typeof window.LirandzoAPI.post === "function") {
        return await window.LirandzoAPI.post(payload);
      }
      if (await isBackendAvailable()) {
        return await apiFetch("", {
          method: "POST",
          body: JSON.stringify(payload),
        });
      }
    } catch (err) {
      if (err && err.message) throw err;
    }
    return { message: "RSVP registado (modo demo).", rsvpStatus: status, rsvpGuests: guests };
  }

  async function fetchMessages() {

        return (result.data || []).map((msg) => ({
          name: msg.name || msg.nome || "Convidado",
          text: msg.text || msg.message || "",
          date: msg.date || msg.timestamp || msg.createdAt || "",

      }
      if (await isBackendAvailable()) {
        const result = await apiFetch("?action=list_messages&slug=" + encodeURIComponent(INVITE_SLUG));
        return (result.data || result || []).map((msg) => ({ name: msg.name || msg.nome || "Convidado", text: msg.text || msg.message || "" }));
      }
    } catch {
      // fallback demo
    }
    return [];
  }

  async function uploadGiftProof(formData) {
    const base = API_BASE || window.LIRANDZO_API_BASE_URL || "";
    if (!base) throw new Error("API Render não configurada para envio do comprovativo.");
    const response = await fetch(`${String(base).replace(/\/+$/, "")}/api/upload_comprovativo`, {
      method: "POST",
      headers: { "X-Invite-Slug": INVITE_SLUG },
      body: formData,
    });
    const contentType = response.headers.get("content-type") || "";
    const data = contentType.includes("application/json") ? await response.json().catch(() => ({})) : {};
    if (!response.ok || data.status === "error") throw new Error(data.message || data.error || `Erro ${response.status}`);
    if (!contentType.includes("application/json")) throw new Error("O servidor não respondeu ao envio do comprovativo. Confirme se o Render/API está activo.");
    return data;
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("Não foi possível ler a fotografia seleccionada."));
      reader.readAsDataURL(file);
    });
  }

  function playChime(freqs, duration = 0.55) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    freqs.forEach((freq, index) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0, ctx.currentTime + index * 0.11);
      gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + index * 0.11 + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + index * 0.11 + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + index * 0.11);
      osc.stop(ctx.currentTime + index * 0.11 + duration + 0.05);
    });
  }

  function playHoverClick() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.type = "sine";
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.015, ctx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }

  function countdownStrip() {
    const c = getTimeLeft(wedding.dateISO);
    return `<div class="countdown-strip" aria-label="Contagem regressiva">
      <span><strong data-countdown-part="days">${twoDigits(c.days)}</strong><small>dias</small></span>
      <span><strong data-countdown-part="hours">${twoDigits(c.hours)}</strong><small>horas</small></span>
      <span><strong data-countdown-part="minutes">${twoDigits(c.minutes)}</strong><small>minutos</small></span>
      <span><strong data-countdown-part="seconds">${twoDigits(c.seconds)}</strong><small>segundos</small></span>
    </div>`;
  }

  function updateCountdown() {
    const c = getTimeLeft(wedding.dateISO);
    $$('[data-countdown-part="days"]').forEach((el) => { el.textContent = twoDigits(c.days); });
    $$('[data-countdown-part="hours"]').forEach((el) => { el.textContent = twoDigits(c.hours); });
    $$('[data-countdown-part="minutes"]').forEach((el) => { el.textContent = twoDigits(c.minutes); });
    $$('[data-countdown-part="seconds"]').forEach((el) => { el.textContent = twoDigits(c.seconds); });
  }

    return `<div class="section-heading"><p>${escapeHtml(eyebrow)}</p><h2>${escapeHtml(title)}</h2>${copy ? `<span>${escapeHtml(copy)}</span>` : ""}</div>`;
  }

  function divider() {
    return `<div class="section-divider"><span class="divider-line"></span><span class="divider-amp">&amp;</span><span class="divider-line"></span></div>`;

  function qrPattern(seed) {
    const base = String(seed).split("").reduce((sum, char) => sum + char.charCodeAt(0), 0);
    let blocks = "";
    for (let index = 0; index < 81; index += 1) {
      const active = ((index * 7 + base) % 5 === 0 || (index + base) % 11 === 0);
      blocks += `<span class="${active ? "is-active" : ""}"></span>`;
    }
    return `<div class="qr-pattern" aria-hidden="true">${blocks}</div>`;
  }
  function guestToken(guest = state.authGuest) {
    return String(guest?.token || guest?.inviteToken || guest?.publicToken || guest?.id || "").trim();
  }

  function checkinUrl(token = guestToken()) {
    const base = new URL("checkin.html", window.location.href);
    if (token) base.searchParams.set("t", token);
    return base.href;
  }

  function qrImage(token = guestToken()) {
    if (!token) return qrPattern(state.authGuest?.name || wedding.displayNames);
    const url = checkinUrl(token);
    return `<img class="qr-code-img" src="https://quickchart.io/qr?size=280&margin=1&text=${encodeURIComponent(url)}" alt="QR Code de check-in do convidado" loading="lazy" />`;
  }

  function petals(count = 14) {
    let html = "";
    for (let i = 0; i < count; i += 1) {
      const left = Math.random() * 100;
      const delay = Math.random() * 12;
      const duration = 8 + Math.random() * 8;
      const size = 0.5 + Math.random() * 0.8;
      const opacity = 0.2 + Math.random() * 0.3;
      const swing = Math.random() * 80 - 40;
      html += `<span class="petal" style="left:${left}%;--swing:${swing}px;--dur:${duration}s;--delay:${delay}s;--size:${size};--opacity:${opacity};"></span>`;
    }
    return `<div class="petals-container" aria-hidden="true">${html}</div>`;
  }

  function rsvpStatusLabel(status) {
    const labels = {
      pending: "Ainda não confirmado",
      confirmed: "Presença confirmada",
      declined: "Presença não confirmada",
    };
    return labels[status] || labels.pending;
  }

  function guestCompanionsCount(guest = state.authGuest) {
    if (!guest) return 0;
    if (Number.isFinite(Number(guest.companions))) return Math.max(Number(guest.companions), 0);
    return Math.max(Number(guest.maxGuests || 1) - 1, 0);
  }

  function guestTotalCount(guest = state.authGuest) {
    if (!guest) return 1;
    return Math.max(Number(guest.maxGuests || guestCompanionsCount(guest) + 1 || 1), 1);
  }

  function bindLoginEvents() {
    const input = $("#login-name");
    const submit = $("#login-submit");
    const form = $("#login-form");
    const error = $("#login-error");

    input.addEventListener("input", () => {
      submit.disabled = !input.value.trim();
      error.classList.add("is-hidden");
    });


    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      input.disabled = true;
      submit.disabled = true;
      submit.querySelector(".login-submit-text").textContent = "A verificar...";
      error.classList.add("is-hidden");

      try {
        const guest = await findGuestByName(name);
        if (!guest) throw new Error("Nome nao encontrado na lista de convidados.");
        state.authGuest = guest;
        sessionStorage.setItem(`wedding_guest_${INVITE_SLUG}`, JSON.stringify(guest));
        playChime([523.25, 659.25, 783.99, 1046.5]);
        startMusic();
        renderWelcome();
      } catch (err) {
        error.textContent = err.message || "Erro ao verificar. Tente novamente.";
        error.classList.remove("is-hidden");
        input.disabled = false;
        submit.disabled = false;
        submit.querySelector(".login-submit-text").textContent = "Entrar";
      }
    });
  }

            <input id="gift-file" name="comprovativoFile" type="file" accept="image/*,.pdf" required />
          </label>
          <button class="btn-primary" type="submit">Enviar comprovativo</button>
          <p class="gift-proof-note is-hidden" id="gift-proof-note"></p>
        </form>
      </div>`;
    }

    return `<div class="modal-copy map-modal"><p class="modal-eyebrow">localização</p><h2>Permita-nos guiá-lo até à celebração.</h2><p><strong>Cerimónia:</strong> ${wedding.ceremonyPlace} · ${wedding.ceremonyTime}</p><p><strong>Recepção:</strong> ${wedding.receptionPlace} · ${wedding.receptionTime}</p><figure class="map-image-card"><img src="./assets/media/mapa.jpg" alt="Mapa de localização do evento" /><figcaption>Referência visual da zona do evento.</figcaption></figure><a class="text-link" href="${wedding.ceremonyMap}" target="_blank" rel="noreferrer">Abrir cerimónia no Google Maps</a><a class="text-link" href="${wedding.receptionMap}" target="_blank" rel="noreferrer">Abrir recepção no Google Maps</a></div>`;
  }

  async function confirmPresenceFromGuest() {
    const note = $("#modal-rsvp-note") || $("#rsvp-note");
    const totalGuests = guestTotalCount(state.authGuest);

    try {
      const result = await submitRSVP(state.authGuest.id, "confirmed", totalGuests);
      state.authGuest = { ...state.authGuest, rsvpStatus: "confirmed", rsvpGuests: totalGuests };
      sessionStorage.setItem(`wedding_guest_${INVITE_SLUG}`, JSON.stringify(state.authGuest));
      if (note) note.textContent = result.message || "Presença confirmada com sucesso.";
    } catch {
      state.authGuest = { ...state.authGuest, rsvpStatus: "confirmed", rsvpGuests: totalGuests };
      sessionStorage.setItem(`wedding_guest_${INVITE_SLUG}`, JSON.stringify(state.authGuest));
      if (note) note.textContent = "Presença confirmada localmente. Quando o servidor estiver activo, o RSVP será sincronizado.";
    }

    if (note) note.classList.remove("is-hidden");
  }

  async function handleRsvpSubmit(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const attendance = form.querySelector("select[id$='attendance'], #attendance")?.value || $("#attendance")?.value || "Confirmo presença";
    const guests = form.querySelector("select[id$='guests-select'], #guests-select")?.value || "1";
    const status = attendance === "Confirmo presença" ? "confirmed" : "declined";
    const note = form.querySelector("#modal-rsvp-note") || $("#rsvp-note");

    try {
      const totalGuests = parseInt(guests, 10);
      const result = await submitRSVP(state.authGuest.id, status, totalGuests);
      state.authGuest = { ...state.authGuest, rsvpStatus: status, rsvpGuests: totalGuests };
      sessionStorage.setItem(`wedding_guest_${INVITE_SLUG}`, JSON.stringify(state.authGuest));
      note.textContent = result.message || "RSVP registado com sucesso.";
    } catch {
      note.textContent = "Resposta guardada localmente. Quando o servidor estiver activo, o RSVP será registado no sistema.";
    }
    note.classList.remove("is-hidden");
  }

  async function handleGuestbookSubmit(event) {
    event.preventDefault();
    const textarea = $("#guestbook-text");
    const text = textarea.value.trim();
    if (!text) return;

    const newMessage = { name: state.authGuest.name || "Convidado", text };
    state.messages = [newMessage, ...state.messages];
    renderMessageStream();
    textarea.value = "";

    try {
      await postMessage(state.authGuest.id, text);
    } catch {
      // a mensagem local já foi apresentada
    }
  }

  function renderMessageStream() {
    const stream = $("#message-stream");
    if (!stream) return;
    stream.innerHTML = state.messages.map((msg, index) => `<blockquote key="${index}"><p>"${escapeHtml(msg.text)}"</p><cite>— ${escapeHtml(msg.name)}</cite></blockquote>`).join("");
  }

  function calendarReminderUrl() {
    const start = new Date(wedding.dateISO);
    const end = new Date(start.getTime() + 7 * 60 * 60 * 1000);
    const localParts = (date) => new Intl.DateTimeFormat("sv-SE", {
      timeZone: wedding.timezone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false,
    }).formatToParts(date).reduce((acc, part) => {
      acc[part.type] = part.value;
      return acc;
    }, {});
    const compact = (date) => {
      const p = localParts(date);
      return `${p.year}${p.month}${p.day}T${p.hour}${p.minute}${p.second}`;
    };
    const details = [
      `Convite privado de ${wedding.displayNames}.`,
      `Cerimónia: ${wedding.ceremonyPlace} às ${wedding.ceremonyTime}.`,
      `Recepção: ${wedding.receptionPlace} às ${wedding.receptionTime}.`,
    ].join("\n");
    const params = new URLSearchParams({
      action: "TEMPLATE",
      text: `Casamento ${wedding.displayNames}`,
      dates: `${compact(start)}/${compact(end)}`,
      ctz: wedding.timezone,
      details,
      location: wedding.address,
    });
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }

  function downloadCalendar() {
    const url = calendarReminderUrl();
    const opened = window.open(url, "_blank", "noopener,noreferrer");
    if (!opened) window.location.href = url;
  }

  function copyIban() {
    navigator.clipboard?.writeText(wedding.bankAccount);
  }

  async function handleGiftProofSubmit(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const note = form.querySelector("#gift-proof-note");
    const button = form.querySelector('button[type="submit"]');
    const fileInput = form.querySelector("#gift-file");
    const file = fileInput?.files?.[0];

    if (!file) {
      if (note) {
        note.textContent = "Seleccione a imagem ou PDF do comprovativo antes de enviar.";
        note.classList.remove("is-hidden");
      }
      return;
    }

    const maxSize = 6 * 1024 * 1024;
    if (file.size > maxSize) {
      if (note) {
        note.textContent = "O ficheiro é demasiado grande. Use uma imagem ou PDF até 6 MB.";
        note.classList.remove("is-hidden");
      }
      return;
    }

    const formData = new FormData(form);
    formData.set("name", state.authGuest?.name || "Convidado");
    formData.set("nome", state.authGuest?.name || "Convidado");
    formData.set("token", guestToken());
    formData.set("slug", INVITE_SLUG);
    formData.set("canal", "Comprovativo");

    if (note) {
      note.textContent = "A enviar comprovativo...";
      note.classList.remove("is-hidden");
    }
    if (button) {
      button.disabled = true;
      button.textContent = "A enviar...";
    }

    try {
      const result = await uploadGiftProof(formData);
      if (note) note.textContent = result.message || result.data?.message || "Comprovativo enviado com sucesso.";
      form.reset();
    } catch (err) {
      if (note) note.textContent = err.message || "Não foi possível enviar o comprovativo. Tente novamente.";
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = "Enviar comprovativo";
      }
    }
  }

  async function handleCapsulePhotoSubmit(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const note = form.querySelector("#capsule-photo-note");
    const button = form.querySelector('button[type="submit"]');
    const fileInput = form.querySelector("#capsule-photo-file");
    const file = fileInput?.files?.[0];

    if (!file) {
      if (note) {
        note.textContent = "Seleccione uma fotografia antes de enviar.";
        note.classList.remove("is-hidden");
      }
      return;
    }

    if (!file.type || !file.type.startsWith("image/")) {
      if (note) {
        note.textContent = "Envie apenas fotografias em formato de imagem.";
        note.classList.remove("is-hidden");
      }
      return;
    }

    const maxSize = 6 * 1024 * 1024;
    if (file.size > maxSize) {
      if (note) {
        note.textContent = "A fotografia é demasiado grande. Use uma imagem até 6 MB.";
        note.classList.remove("is-hidden");
      }
      return;
    }

    if (note) {
      note.textContent = "A enviar fotografia...";
      note.classList.remove("is-hidden");
    }
    if (button) {
      button.disabled = true;
      button.textContent = "A enviar...";
    }

    try {
      const result = await uploadCapsulePhoto(file);
      if (note) note.textContent = result.message || result.data?.message || "Fotografia enviada com sucesso.";
      form.reset();
    } catch (err) {
      if (note) note.textContent = err.message || "Não foi possível enviar a fotografia. Tente novamente.";
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = "Enviar fotografia";
      }
    }
  }

  function ensureMusic() {
    if (state.audio && state.audio instanceof HTMLAudioElement) return state.audio;
    const audio = new Audio(wedding.musicUrl);
    audio.loop = true;
    audio.preload = "auto";
    audio.volume = 0.52;
    state.audio = audio;
    audio.addEventListener("play", updateMusicButton);
    audio.addEventListener("pause", updateMusicButton);
    audio.addEventListener("ended", updateMusicButton);
    return audio;
  }

  function updateMusicButton() {
    const button = $('[data-action="music"]');
    if (!button) return;
    const audio = state.audio instanceof HTMLAudioElement ? state.audio : null;
    const isPlaying = Boolean(audio && !audio.paused && !audio.ended);
    button.setAttribute("aria-label", isPlaying ? "Parar musica" : "Tocar musica");
    button.innerHTML = isPlaying
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`
      : `<svg class="music-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>`;
  }

  function startMusic() {
    const audio = ensureMusic();
    const playPromise = audio.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(() => updateMusicButton());
    }
    updateMusicButton();
  }

  function toggleMusic() {
    const audio = ensureMusic();
    if (audio.paused || audio.ended) {
      startMusic();
    } else {
      audio.pause();
      updateMusicButton();
    }
  }

  function stopMusic() {
    const audio = state.audio instanceof HTMLAudioElement ? state.audio : null;
    if (!audio) return;
    audio.pause();
    audio.currentTime = 0;
    updateMusicButton();
  }

  function logout() {
    sessionStorage.removeItem(`wedding_guest_${INVITE_SLUG}`);
    state.authGuest = null;
    stopMusic();
    closeModal();
    renderEntryCover();
  }

  function setupCursor() {
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    if (isTouch) return;
    const dot = document.createElement("div");
    const ring = document.createElement("div");
    dot.className = "cursor-dot";
    ring.className = "cursor-ring";
    document.body.append(dot, ring);

    window.addEventListener("mousemove", (event) => {
      const pos = `translate3d(${event.clientX}px, ${event.clientY}px, 0)`;
      dot.style.transform = pos;
      ring.style.transform = pos;
    });

    const observer = new MutationObserver(bindCursorTargets);
    observer.observe(document.body, { childList: true, subtree: true });
    bindCursorTargets();
  }

  function bindCursorTargets() {
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    if (isTouch) return;
    const dot = $(".cursor-dot");
    const ring = $(".cursor-ring");
    if (!dot || !ring) return;
    $$('button, a, input, select, textarea, [role="button"]').forEach((el) => {
      if (el.dataset.cursorBound) return;
      el.dataset.cursorBound = "true";
      el.addEventListener("mouseenter", () => { dot.classList.add("is-hovering"); ring.classList.add("is-hovering"); });
      el.addEventListener("mouseleave", () => { dot.classList.remove("is-hovering"); ring.classList.remove("is-hovering"); });
    });
  }


  function prefersReducedMotion() {
    return window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  }

  function initPremiumMotion() {
    document.documentElement.classList.add("motion-ready");
    initScrollProgress();
    initRevealAnimations(document);
    initRippleInteractions(document);
    initParallaxMotion();
  }

  function initScrollProgress() {
    const progress = $(".scroll-progress span");
    if (!progress || progress.dataset.progressBound) return;
    progress.dataset.progressBound = "true";

    const update = () => {
      const scrollable = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const value = Math.min(Math.max(window.scrollY / scrollable, 0), 1);
      progress.style.transform = `scaleX(${value})`;
    };

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update, { passive: true });
    update();
  }

  function prepareRevealElements(root = document) {
    const revealGroups = [
      [".hero .handwriting, .hero h1, .hero-date, .hero .countdown-strip, .hero-actions, .scroll-cue", "hero"],
      [".section-heading p, .section-heading h2, .section-heading span, .rsvp-title p, .rsvp-title h2, .rsvp-title span, .event-pass-copy p, .event-pass-copy h2, .event-pass-copy span, .modal-eyebrow, .modal-copy h2, .modal-copy p", "text"],
      [".date-editorial, .vow-copy, .story-content, .detail-row, .concierge-item, .rsvp-action-card, .rsvp-choice-card, .guestbook-form, .message-stream blockquote, .final-section > div:not(.final-bg), .modal-timeline div, .guest-info-list li, .pass-meta span, .pass-note, .pass-actions", "fade-up"],
      [".gallery-mosaic button, .story-photo, .phone-invite, .event-pass, .split-modal img, .gallery-lightbox img, .final-bg, .map-visual, .pass-qr-block", "photo"],
    ];

    revealGroups.forEach(([selector, type]) => {
      $$(selector, root).forEach((element, index) => {
        if (element.dataset.revealReady === "true") return;
        element.dataset.revealReady = "true";
        element.dataset.reveal = element.dataset.reveal || type;
        element.style.setProperty("--reveal-delay", `${Math.min(index % 8, 7) * 78}ms`);
      });
    });
  }

  function revealElement(element) {
    element.classList.add("is-revealed");
    element.removeAttribute("data-reveal-stuck");
  }

  function initRevealAnimations(root = document) {
    prepareRevealElements(root);

    const elements = $$('[data-reveal="hero"], [data-reveal="text"], [data-reveal="fade-up"], [data-reveal="photo"]', root)
      .filter((element) => !element.classList.contains("is-revealed"));

    if (!elements.length) return;

    const revealVisibleNow = () => {
      elements.forEach((element) => {
        if (element.classList.contains("is-revealed")) return;
        const rect = element.getBoundingClientRect();
        if (rect.top < window.innerHeight * 1.12 && rect.bottom > -80) revealElement(element);
      });
    };

    // Conteúdos dentro de modais/lightboxes não devem ficar escondidos por scroll interno.
    if (root?.id === "modal-shell" || root?.classList?.contains("modal-shell")) {
      elements.forEach(revealElement);
      return;
    }

    if (prefersReducedMotion() || !("IntersectionObserver" in window)) {
      elements.forEach(revealElement);
      return;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        revealElement(entry.target);
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.01, rootMargin: "180px 0px 180px 0px" });

    elements.forEach((element) => observer.observe(element));

    const fallbackKey = root === document ? document.documentElement : root;
    if (fallbackKey && fallbackKey.dataset.revealFallbackBound !== "true") {
      fallbackKey.dataset.revealFallbackBound = "true";
      window.addEventListener("scroll", revealVisibleNow, { passive: true });
      window.addEventListener("resize", revealVisibleNow, { passive: true });
      window.addEventListener("load", revealVisibleNow, { passive: true });
    }

    window.requestAnimationFrame(revealVisibleNow);
    window.setTimeout(revealVisibleNow, 450);
    window.setTimeout(revealVisibleNow, 1400);
  }

  function initRippleInteractions(root = document) {
    $$('.btn-primary, .btn-outline, .std-cover-button, .login-submit, .concierge-item button, .concierge-item a, .bottom-lightbox-button, .quick-nav a, .quick-nav button, .pass-actions button, .gallery-lightbox nav button', root).forEach((element) => {
      if (element.dataset.rippleBound === "true") return;
      element.dataset.rippleBound = "true";
      element.classList.add("has-ripple");
      element.addEventListener("pointerdown", (event) => {
        const rect = element.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "tap-ripple";
        ripple.style.left = `${event.clientX - rect.left}px`;
        ripple.style.top = `${event.clientY - rect.top}px`;
        element.appendChild(ripple);
        window.setTimeout(() => ripple.remove(), 650);
      });
    });
  }

  function initParallaxMotion() {
    if (prefersReducedMotion()) return;
    const layers = [
      { element: $(".hero-bg"), speed: -0.075, limit: 34 },
      { element: $(".final-bg img"), speed: 0.11, limit: 44 },
      { element: $(".phone-invite"), speed: 0.035, limit: 18 },
    ].filter((item) => item.element && item.element.dataset.parallaxMotionBound !== "true");

    if (!layers.length) return;
    layers.forEach((item) => { item.element.dataset.parallaxMotionBound = "true"; });

    let ticking = false;
    const update = () => {
      ticking = false;
      layers.forEach(({ element, speed, limit }) => {
        const rect = element.getBoundingClientRect();
        if (rect.bottom < -80 || rect.top > window.innerHeight + 80) return;
        const center = rect.top + rect.height / 2;
        const offset = Math.max(Math.min((center - window.innerHeight / 2) * speed, limit), -limit);
        element.style.setProperty("--scroll-y", `${offset.toFixed(2)}px`);
      });
    };

    const requestUpdate = () => {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    };

    window.addEventListener("scroll", requestUpdate, { passive: true });
    window.addEventListener("resize", requestUpdate, { passive: true });
    update();
  }

  function addParallaxHandler() {
    // Mantido por compatibilidade com versões anteriores; a animação de scroll actual
    // é controlada por initParallaxMotion() usando variáveis CSS, sem sobrescrever reveals.
    initParallaxMotion();
  }

  function boot() {
    setupCursor();
    try {
      const raw = sessionStorage.getItem(`wedding_guest_${INVITE_SLUG}`);
      state.authGuest = raw ? JSON.parse(raw) : null;
    } catch {
      state.authGuest = null;
    }
    if (state.authGuest) renderExperience();
    else renderEntryCover();
  }

  document.addEventListener("DOMContentLoaded", boot);
})();
