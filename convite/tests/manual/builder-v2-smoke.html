<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Builder V2 Smoke Test</title>
  <link rel="stylesheet" href="../../adminmanager-builder-v2.css">
  <style>
    *{box-sizing:border-box} :root{--bg:#1f1b18;--bg-2:#28221f;--surface:#322b27;--surface-2:#3a312c;--surface-3:#181411;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.18);--accent:#b08968;--accent-2:#d0ad8f;--accent-soft:rgba(176,137,104,.15);--text:#f6efe9;--text-2:#d8cec6;--muted:#a79b92;--green:#18b783;--blue:#6aa5ff;--orange:#f2a84a;--red:#ef5b5b;--shadow:0 18px 50px rgba(0,0,0,.24);--font-heading:Georgia,serif;--font-body:Arial,sans-serif;--topbar:62px;--safe-top:0px}
    body{margin:0;background:linear-gradient(145deg,var(--bg),var(--bg-2));color:var(--text-2);font-family:var(--font-body);min-height:100vh}.smoke-banner{padding:10px 14px;background:#123b2f;color:#bdf4dc;font-size:12px;font-weight:700;position:sticky;top:0;z-index:99}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 38px)}aside{border-right:1px solid var(--line);padding:14px;background:rgba(0,0,0,.12)}.nav{display:grid;gap:6px}.nav-item,.mobile-tab,.btn{border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--text-2);padding:9px 11px;border-radius:12px;cursor:pointer}.nav-item{display:flex;gap:8px;width:100%;margin-bottom:6px}.content{padding:18px;min-width:0}.section{display:none}.section.active{display:block}.panel-card{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:18px;margin-bottom:12px}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;color:var(--text)}.panel-body{padding:14px}.section-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h1{margin:0;color:var(--text)}.section-title p{margin:4px 0 0;color:var(--muted)}.search-input,.field input,.field select,.field textarea{width:100%;background:#171311;border:1px solid var(--line-strong);color:var(--text);padding:10px;border-radius:12px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:10px;color:var(--accent-2);font-weight:700;text-transform:uppercase}.hint{font-size:10px;color:var(--muted)}.metrics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric-card{border:1px solid var(--line);padding:10px;border-radius:14px}.metric-card span,.metric-card small{display:block;color:var(--muted);font-size:10px}.metric-card strong{display:block;color:var(--text);font-size:22px}.feedback{margin-top:10px;padding:10px;border:1px solid var(--line-strong);border-radius:12px}.hidden{display:none!important}.mobile-tabs{display:none}.feather{width:16px;height:16px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.content{padding:12px}.mobile-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:#171311;padding:8px;z-index:100;gap:6px;overflow-x:auto}.metrics-grid{grid-template-columns:1fr}.content{padding-bottom:80px}}
  </style>
</head>
<body>
  <div class="smoke-banner">SMOKE TEST LOCAL — dados simulados · sem Render · sem MongoDB · sem convites reais</div>
  <div class="layout">
    <aside><nav class="nav" id="sideNav"><button class="nav-item" data-panel="manage"><span>Gestão</span></button></nav></aside>
    <main class="content">
      <section class="section active" id="managePanel"><div class="section-title"><div><h1>Ambiente de teste</h1><p>Use o menu Construtor. Todas as operações ficam apenas na memória desta página.</p></div></div></section>
    </main>
  </div>
  <div class="mobile-tabs" id="mobileTabs"><button class="mobile-tab" data-panel="manage">Gestão</button></div>

  <script>
    var panels = [{ id:'manage', label:'Gestão', icon:'settings' }];
    var invites = [{ id:'smoke-edna', slug:'edna-mauro', coupleNames:'Edna & Mauro', packageKey:'esmeralda', contentMode:'legacy' }];
    var smokeDraftRevision = 2;
    var smokePublishedRevision = 1;
    var smokeDraft = {
      schemaVersion:'2.0',
      identity:{slug:'edna-mauro',packageKey:'esmeralda',templateKey:'esmeralda-edma',eventType:'Casamento',language:'Português'},
      people:{coupleNames:'Edna Otília Mondlane & Mauro Damison Macamo',displayNames:'Edna & Mauro',bride:'Edna',groom:'Mauro',monogram:'EM',brideParents:'Rojasse Mondlane e Marta João da Silva',groomParents:'Damison Macamo e Celeste Macucule'},
      event:{dateISO:'2026-11-07',dateLabel:'07 de Novembro de 2026',timezone:'Africa/Maputo',rsvpDeadline:'2026-11-01',verse:'Por isso deixará o homem seu pai e sua mãe, e se unirá à sua mulher; e serão dois numa só carne.',verseReference:'Gênesis 2:24',invitationNote:'Não extensivo a crianças.'},
      schedule:[{id:'cerimonia',type:'religious',title:'Cerimónia Religiosa',time:'09:30',venue:'Paróquia Nossa Senhora das Vitórias da Malhanguane',mapUrl:'',note:''},{id:'recepcao',type:'reception',title:'Recepção',time:'13:00',venue:'Salão de Eventos The Gardens',mapUrl:'https://maps.google.com/?q=25.791513,32.674191',note:''}],
      story:{title:'A Nossa História',text:'Texto editorial de demonstração para validar o layout do Builder V2.',chapters:[{id:'chapter-1',title:'O Encontro',text:'Capítulo de teste.'}],letter:''},
      access:{mode:'open',rsvpIdentity:'name',requireNameOnActions:true,maxGuestsPerRsvp:2,allowCompanionName:true,autoCreateGuestOnRsvp:true,autoCreateGuestOnGift:true},
      features:{story:true,gallery:true,rsvp:true,dressCode:true,gifts:true,contributions:true,messages:true,checkin:false,capsule:false,guestInfo:true,menu:true},
      gifts:{mode:'catalog',catalogMode:'mongo',store:'Loiça Amiga, Baixa da Cidade, Av. Karl Marx',options:[]},
      media:{heroImage:'',coverImage:'',storyImage:'',musicUrl:'https://static.wixstatic.com/mp3/819ea0_e333d443f2f545e59d79429cdd3c1361.mp3'},
      seo:{title:'Edna & Mauro | Lirandzo',description:'Convite de casamento de Edna & Mauro.',image:''},
      runtime:{contentMode:'legacy',rendererVersion:'v1'}
    };
    var smokeRevisions = [
      { revision:2, stage:'draft', note:'Draft guardado no smoke test', createdAt:new Date().toISOString() },
      { revision:1, stage:'published', note:'Publicação simulada anterior', createdAt:new Date(Date.now()-3600000).toISOString() }
    ];

    function clone(v){ return JSON.parse(JSON.stringify(v)); }
    function isAdmin(){ return true; }
    function iconRefresh(){}
    function appToast(message){ console.log('[SMOKE TOAST]', message); }
    function showPanel(id){ document.querySelectorAll('.section').forEach(el=>el.classList.remove('active')); document.getElementById(id+'Panel')?.classList.add('active'); }
    async function api(path, options={}){
      const method = String(options.method || 'GET').toUpperCase();
      const payload = options.body ? JSON.parse(options.body) : {};
      await new Promise(resolve=>setTimeout(resolve,120));
      if (path.endsWith('/content') && method==='GET') return {status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},suggestedDraft:null}};
      if (path.includes('/content/revisions')) return {status:'success',data:clone(smokeRevisions)};
      if (path.endsWith('/content/draft') && method==='PUT'){
        smokeDraft = clone(payload.content); smokeDraftRevision += 1;
        smokeRevisions.unshift({revision:smokeDraftRevision,stage:'draft',note:payload.note || '',createdAt:new Date().toISOString()});
        return {status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},validation:{valid:true,errors:[],warnings:[]}}};
      }
      if (path.endsWith('/content/validate') && method==='POST') return {status:'success',data:{stage:'publish',draftRevision:smokeDraftRevision,valid:true,errors:[],warnings:[],content:clone(payload.content)}};
      if (path.endsWith('/content/publish') && method==='POST'){
        smokePublishedRevision += 1;
        smokeRevisions.unshift({revision:smokePublishedRevision,stage:'published',note:'Publicação simulada',createdAt:new Date().toISOString()});
        return {status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},unchanged:false,rendererActivated:false,activationNote:'SMOKE: conteúdo publicado em memória; renderer continua legacy.'}};
      }
      if (path.endsWith('/content/rollback') && method==='POST'){
        smokeDraftRevision += 1;
        smokeRevisions.unshift({revision:smokeDraftRevision,stage:'draft',note:'Rollback simulado para Draft',createdAt:new Date().toISOString()});
        return {status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},sourcePublishedRevision:payload.revision,publishedChanged:false,note:'SMOKE: revisão restaurada apenas para Draft.'}};
      }
      throw new Error('Rota não simulada: '+method+' '+path);
    }
  </script>
  <script src="../../adminmanager-builder-v2.js"></script>
</body>
</html>
