<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Builder V2 Smoke Test · Admin shell</title>
  <link rel="stylesheet" href="../../adminmanager-builder-v2.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#241f1c;--bg-2:#2b2623;--surface:#332d29;--surface-2:#3a332f;--surface-3:#211c19;--line:rgba(224,203,184,.14);--line-strong:rgba(224,203,184,.25);--accent:#b08968;--accent-2:#d0ad8f;--accent-soft:rgba(176,137,104,.15);--text:#f6efe9;--text-2:#d8cec6;--muted:#a79b92;--green:#18b783;--blue:#6aa5ff;--orange:#f2a84a;--red:#ef5b5b;--shadow:0 18px 50px rgba(0,0,0,.24);--font-heading:Georgia,serif;--font-body:Arial,sans-serif;--sidebar:236px;--topbar:62px;--banner:34px;--safe-top:0px}
    body{min-height:100vh;background:radial-gradient(circle at 16% -5%,rgba(176,137,104,.18),transparent 34%),linear-gradient(145deg,var(--bg),var(--bg-2));color:var(--text-2);font-family:var(--font-body);line-height:1.45;overflow-x:hidden}
    button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .smoke-banner{height:var(--banner);display:flex;align-items:center;padding:0 14px;background:#0f4a3b;color:#bdf4dc;font-size:11px;font-weight:900;position:fixed;left:0;right:0;top:0;z-index:5000;border-bottom:1px solid rgba(255,255,255,.08)}
    .sidebar{position:fixed;left:0;top:var(--banner);bottom:0;width:var(--sidebar);background:rgba(51,45,41,.96);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;z-index:1000}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#916848);color:#fff;font-family:var(--font-heading);font-size:22px;font-weight:900}.brand h1{color:var(--text);font-family:var(--font-heading);font-size:27px;line-height:1}.brand p{color:var(--muted);font-size:11px;margin-top:3px}.nav{display:grid;gap:5px}.nav-item{width:100%;min-height:42px;border:0;border-radius:14px;background:transparent;color:var(--text-2);display:flex;align-items:center;gap:10px;padding:0 11px;font-weight:900;font-size:13px;text-align:left;cursor:pointer}.nav-item:hover{background:var(--accent-soft);color:var(--text)}.nav-item.active{background:linear-gradient(135deg,var(--accent),#916848);color:#fff}
    .topbar{position:fixed;top:var(--banner);left:var(--sidebar);right:0;height:var(--topbar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:rgba(51,45,41,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);z-index:800}.topbar-title strong{display:block;color:var(--text);font-family:var(--font-heading);font-size:22px}.topbar-title span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.topbar-actions{display:flex;align-items:center;gap:7px}.sync-pill{min-height:34px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted);font-size:11px;font-weight:900;background:rgba(33,28,25,.42)}.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(24,183,131,.12)}
    .main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));padding:calc(var(--banner) + var(--topbar) + 18px) 18px 30px;min-width:0}.content{max-width:1360px;margin:0 auto}.section{display:none}.section.active{display:block;animation:fadeUp .22s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.section-title h1{color:var(--text);font-family:var(--font-heading);font-size:clamp(28px,4vw,38px);line-height:.98}.section-title p{color:var(--muted);font-size:12px;margin-top:5px}
    .btn{min-height:38px;border:1px solid var(--line-strong);border-radius:999px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(58,51,47,.86);color:var(--text-2);font-weight:900;font-size:12px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--accent),#916848);color:#fff;border-color:transparent}.btn.small{min-height:31px;padding:0 10px;font-size:11px}.btn.icon-only{width:38px;padding:0}.panel-card{border:1px solid var(--line);border-radius:18px;background:rgba(51,45,41,.72);margin-bottom:12px;overflow:hidden}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{color:var(--text);font-size:15px}.panel-body{padding:14px}.search-input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:14px;outline:none;background:rgba(33,28,25,.82);color:var(--text);padding:11px 12px}.field{display:grid;gap:7px;margin-bottom:12px}.field label{color:var(--accent-2);font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.field textarea{min-height:140px;resize:vertical}.hint{color:var(--muted);font-size:11px}.metrics-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric-card{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(51,45,41,.58)}.metric-card span,.metric-card small{display:block;color:var(--muted);font-size:10px}.metric-card strong{display:block;color:var(--text);font-size:24px;line-height:1.1;margin:3px 0}.feedback{border-radius:15px;padding:11px 12px;margin-top:11px;font-size:12px;border:1px solid var(--line-strong);background:var(--accent-soft);color:var(--text-2)}
    .placeholder-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.placeholder-card{min-height:110px;border:1px solid var(--line);border-radius:18px;background:rgba(51,45,41,.55);padding:14px}.placeholder-card strong{color:var(--text);display:block;margin-bottom:4px}.placeholder-card span{font-size:11px;color:var(--muted)}.mobile-tabs{display:none}
    @media(max-width:900px){:root{--sidebar:0px}.sidebar{display:none}.topbar{left:0}.main{margin-left:0;width:100%;padding-left:10px;padding-right:10px;padding-bottom:86px}.mobile-tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1600;padding:8px 10px;gap:7px;overflow-x:auto;background:rgba(36,31,28,.96);border-top:1px solid var(--line)}.mobile-tab{flex:0 0 auto;min-height:34px;border:1px solid var(--line);border-radius:999px;background:rgba(51,45,41,.86);color:var(--text-2);padding:0 11px;font-size:11px;font-weight:900}.mobile-tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),#916848)}.metrics-grid{grid-template-columns:1fr}.placeholder-grid{grid-template-columns:1fr 1fr}.section-title{align-items:flex-start;flex-direction:column}.sync-pill{display:none}}
  </style>
</head>
<body>
  <div class="smoke-banner">SMOKE TEST LOCAL — shell do Admin reproduzido · dados simulados · sem Render · sem MongoDB · sem convites reais</div>

  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">L</div><div><h1>Admin</h1><p>Centro de gestão</p></div></div>
    <nav class="nav" id="sideNav"></nav>
  </aside>

  <header class="topbar">
    <div class="topbar-title"><strong id="topbarTitle">Gestão</strong><span>Sistema protegido · ambiente local simulado</span></div>
    <div class="topbar-actions"><div class="sync-pill"><span class="sync-dot"></span><span>Online local</span></div><button class="btn icon-only" type="button" title="Actualizar">↻</button><button class="btn icon-only" type="button" title="Site principal">↗</button></div>
  </header>

  <main class="main"><div class="content" id="contentRoot"></div></main>
  <div class="mobile-tabs" id="mobileTabs"></div>

  <script>
    var panels = [
      { id:'dashboard', label:'Dashboard', icon:'layout' },
      { id:'invites', label:'Convites', icon:'folder' },
      { id:'clients', label:'Clientes', icon:'briefcase' },
      { id:'command', label:'Ficha', icon:'command' },
      { id:'backups', label:'Backups', icon:'hard-drive' },
      { id:'archived', label:'Arquivados', icon:'archive' },
      { id:'newInvite', label:'Novo cliente', icon:'plus-circle' },
      { id:'manage', label:'Gestão', icon:'settings' },
      { id:'guests', label:'Convidados', icon:'users' },
      { id:'gifts', label:'Presentes', icon:'gift' },
      { id:'github', label:'GitHub', icon:'git-branch' }
    ];
    var invites = [{ id:'smoke-edna', slug:'edna-mauro', coupleNames:'Edna & Mauro', packageKey:'esmeralda', contentMode:'legacy' }];
    var smokeDraftRevision = 2;
    var smokePublishedRevision = 1;
    var smokeDraft = {
      schemaVersion:'2.0',
      identity:{slug:'edna-mauro',packageKey:'esmeralda',templateKey:'esmeralda-edma',eventType:'Casamento',language:'Português'},
      people:{coupleNames:'Edna Otília Mondlane & Mauro Damison Macamo',displayNames:'Edna & Mauro',bride:'Edna',groom:'Mauro',monogram:'EM',brideParents:'Rojasse Mondlane e Marta João da Silva',groomParents:'Damison Macamo e Celeste Macucule'},
      event:{dateISO:'2026-11-07',dateLabel:'07 de Novembro de 2026',timezone:'Africa/Maputo',rsvpDeadline:'2026-11-01',verse:'Por isso deixará o homem seu pai e sua mãe, e se unirá à sua mulher; e serão dois numa só carne.',verseReference:'Gênesis 2:24',invitationNote:'Não extensivo a crianças.'},
      schedule:[{id:'cerimonia',type:'religious',title:'Cerimónia Religiosa',time:'09:30',venue:'Paróquia Nossa Senhora das Vitórias da Malhanguane',mapUrl:'',note:''},{id:'recepcao',type:'reception',title:'Recepção',time:'13:00',venue:'Salão de Eventos The Gardens',mapUrl:'https://maps.google.com/?q=25.791513,32.674191',note:''}],
      story:{title:'A Nossa História',text:'Texto editorial de demonstração para validar o layout do Builder V2.',chapters:[{id:'chapter-1',title:'O Encontro',text:'Capítulo de teste.'}],letter:''},
      access:{mode:'open',rsvpIdentity:'name',requireNameOnActions:true,maxGuestsPerRsvp:2,allowCompanionName:true,autoCreateGuestOnRsvp:true,autoCreateGuestOnGift:true},
      features:{story:true,gallery:true,rsvp:true,dressCode:true,gifts:true,contributions:true,messages:true,checkin:false,capsule:false,guestInfo:true,menu:true},
      gifts:{mode:'catalog',catalogMode:'mongo',store:'Loiça Amiga, Baixa da Cidade, Av. Karl Marx',options:[]},
      payments:{bankAccounts:[],mobilePayments:[]},
      support:{text:'Apoio e orientação',contacts:['+258 84 433 6578','+258 84 113 9064'],whatsapp:'+258844336578',whatsappSecondary:'+258841139064'},
      gallery:{title:'Momentos',items:[]},dressCode:{title:'Tons Neutros',note:'',image:''},menu:{title:'',note:'',items:[]},
      media:{heroImage:'',coverImage:'',storyImage:'',musicUrl:'https://static.wixstatic.com/mp3/819ea0_e333d443f2f545e59d79429cdd3c1361.mp3'},
      seo:{title:'Edna & Mauro | Lirandzo',description:'Convite de casamento de Edna & Mauro.',image:''},
      runtime:{contentMode:'legacy',rendererVersion:'v1'}
    };
    var smokeRevisions = [
      { revision:2, stage:'draft', note:'Draft guardado no smoke test', createdAt:new Date().toISOString() },
      { revision:1, stage:'published', note:'Publicação simulada anterior', createdAt:new Date(Date.now()-3600000).toISOString() }
    ];

    function escapeLocal(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function shellPanel(panel){
      if(panel.id==='manage') return `<section class="section active" id="managePanel"><div class="section-title"><div><h1>Gestão por convite</h1><p>Shell actual do Admin mantido. Abra Construtor para testar a nova interface.</p></div></div><div class="placeholder-grid"><div class="placeholder-card"><strong>Reset de acesso</strong><span>Função histórica representada no shell.</span></div><div class="placeholder-card"><strong>Reset de presentes</strong><span>Função histórica representada no shell.</span></div><div class="placeholder-card"><strong>Limpar presentes</strong><span>Função histórica representada no shell.</span></div><div class="placeholder-card"><strong>Eliminar convite</strong><span>Função histórica representada no shell.</span></div></div></section>`;
      return `<section class="section" id="${panel.id}Panel"><div class="section-title"><div><h1>${escapeLocal(panel.label)}</h1><p>Painel existente preservado no Admin Manager. O smoke não executa operações deste módulo.</p></div></div><div class="placeholder-card"><strong>${escapeLocal(panel.label)}</strong><span>Este painel continua fora do escopo do Builder V2 e não é substituído.</span></div></section>`;
    }
    function buildShell(){
      document.getElementById('sideNav').innerHTML=panels.map(p=>`<button class="nav-item ${p.id==='manage'?'active':''}" data-panel="${p.id}" type="button"><span>${escapeLocal(p.label)}</span></button>`).join('');
      document.getElementById('mobileTabs').innerHTML=panels.map(p=>`<button class="mobile-tab ${p.id==='manage'?'active':''}" data-panel="${p.id}" type="button">${escapeLocal(p.label)}</button>`).join('');
      document.getElementById('contentRoot').innerHTML=panels.map(shellPanel).join('');
    }
    function clone(v){return JSON.parse(JSON.stringify(v));}
    function isAdmin(){return true;}
    function iconRefresh(){}
    function appToast(message){console.log('[SMOKE TOAST]',message);}
    function showPanel(id){
      document.querySelectorAll('.section').forEach(el=>el.classList.toggle('active',el.id===id+'Panel'));
      document.querySelectorAll('[data-panel]').forEach(el=>el.classList.toggle('active',el.dataset.panel===id));
      const p=panels.find(item=>item.id===id);document.getElementById('topbarTitle').textContent=p?p.label:'AdminManager';
      window.scrollTo({top:0,behavior:'smooth'});
    }
    document.addEventListener('click',event=>{const btn=event.target.closest('[data-panel]');if(btn)showPanel(btn.dataset.panel);});
    async function api(path,options={}){
      const method=String(options.method||'GET').toUpperCase();const payload=options.body?JSON.parse(options.body):{};await new Promise(resolve=>setTimeout(resolve,120));
      if(path.endsWith('/content')&&method==='GET')return{status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},suggestedDraft:null}};
      if(path.includes('/content/revisions'))return{status:'success',data:clone(smokeRevisions)};
      if(path.endsWith('/content/draft')&&method==='PUT'){smokeDraft=clone(payload.content);smokeDraftRevision+=1;smokeRevisions.unshift({revision:smokeDraftRevision,stage:'draft',note:payload.note||'',createdAt:new Date().toISOString()});return{status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},validation:{valid:true,errors:[],warnings:[]}}};}
      if(path.endsWith('/content/validate')&&method==='POST')return{status:'success',data:{stage:'publish',draftRevision:smokeDraftRevision,valid:true,errors:[],warnings:[],content:clone(payload.content)}};
      if(path.endsWith('/content/publish')&&method==='POST'){smokePublishedRevision+=1;smokeRevisions.unshift({revision:smokePublishedRevision,stage:'published',note:'Publicação simulada',createdAt:new Date().toISOString()});return{status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},unchanged:false,rendererActivated:false,activationNote:'SMOKE: conteúdo publicado em memória; renderer continua legacy.'}};}
      if(path.endsWith('/content/rollback')&&method==='POST'){smokeDraftRevision+=1;smokeRevisions.unshift({revision:smokeDraftRevision,stage:'draft',note:'Rollback simulado para Draft',createdAt:new Date().toISOString()});return{status:'success',data:{invite:clone(invites[0]),content:{draft:clone(smokeDraft),published:clone(smokeDraft),draftRevision:smokeDraftRevision,publishedRevision:smokePublishedRevision},sourcePublishedRevision:payload.revision,publishedChanged:false,note:'SMOKE: revisão restaurada apenas para Draft.'}};}
      throw new Error('Rota não simulada: '+method+' '+path);
    }
    buildShell();
  </script>
  <script src="../../adminmanager-builder-v2.js"></script>
</body>
</html>
